<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🎧 POTIFY</title>

  <!-- MOBILE FIX -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>🎧 POTIFY</h1>
  </header>

  <!-- TABS -->
  <nav class="tabs">
    <button class="tab active" data-tab="home">Home</button>
    <button class="tab" data-tab="playlists">Playlists</button>
    <button class="tab" data-tab="account">Account</button>
  </nav>

  <!-- ================= HOME TAB ================= -->
  <section id="home" class="tab-content active">

    <!-- SEARCH -->
    <input id="search" type="text" placeholder="Search songs or YouTube..." />

    <!-- 🔴 YOUTUBE RESULTS (REQUIRED) -->
    <ul id="youtubeResults"></ul>

    <h3>Songs</h3>
    <ul id="songs"></ul>

  </section>

  <!-- ================= PLAYLIST TAB ================= -->
  <section id="playlistsTab" class="tab-content">
    <h3>📂 Playlists</h3>

    <input
      id="playlistName"
      type="text"
      placeholder="New playlist name"
    />

    <button id="createPlaylist">Create</button>

    <select id="playlistSelect">
      <option value="">Select playlist</option>
    </select>

    <ul id="playlists"></ul>
  </section>

  <!-- ================= ACCOUNT TAB ================= -->
  <section id="account" class="tab-content">
    <h3>👤 Account</h3>
    <p>Login & profile coming soon.</p>
  </section>

  <!-- ================= STICKY MINI PLAYER ================= -->
  <div id="miniPlayer">

    <div id="miniInfo">
      <span id="miniTitle">No song playing</span>
    </div>

    <div id="miniControls">
      <button id="prevBtn">⏮</button>
      <button id="playPauseBtn">⏯</button>
      <button id="nextBtn">⏭</button>

      <button id="shuffleBtn">🔀</button>
      <button id="repeatBtn">🔁</button>

      <!-- 🔊 VOLUME -->
      <input
        type="range"
        id="volumeSlider"
        min="0"
        max="100"
        value="70"
        title="Volume"
      />
    </div>

    <!-- AUDIO (GLOBAL PLAYER) -->
    <audio id="audio"></audio>

  </div>

  <!-- FOOTER -->
  <footer>
    <p>Made by <strong>Deepu</strong> & <strong>Harshit</strong></p>
    <p>Educational project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
