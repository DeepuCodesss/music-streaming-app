<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎧 POTIFY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🎧 POTIFY</h1>

  <!-- 🔍 Search -->
  <input
    type="text"
    id="search"
    placeholder="Search songs..."
    style="padding:8px; width:220px; margin-bottom:12px;"
  />

  <!-- 🎶 Songs -->
  <h3>Songs</h3>
  <ul id="songs"></ul>

  <!-- 🎧 Player -->
  <audio id="audio" controls></audio>

  <!-- 📂 PLAYLIST SECTION -->
  <hr style="margin:30px 0; opacity:0.3">

  <h3>📂 Playlists</h3>

  <!-- Create playlist -->
  <input
    type="text"
    id="playlistName"
    placeholder="New playlist name"
  />
  <button id="createPlaylist">Create</button>

  <!-- Select playlist -->
  <div style="margin-top:15px;">
    <select id="playlistSelect">
      <option value="">Select playlist</option>
    </select>
  </div>

  <!-- Playlist list -->
  <ul id="playlists"></ul>

  <!-- 🔽 Footer -->
  <footer style="margin-top:40px; font-size:13px; color:gray;">
    <p>Made by <strong>Deepu</strong> & <strong>Harshit</strong></p>
    <p style="font-size:12px;">
      This project is for educational and demo purposes only.
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
